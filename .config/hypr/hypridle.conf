general {
    lock_cmd = pidof hyprlock || hyprlock            # avoid starting multiple hyprlock instances.
    before_sleep_cmd = pidof hyprlock || hyprlock    # lock before suspend.
    after_sleep_cmd = ~/.config/hypr/scripts/display-power.sh on  # wake through Hyprland's typed Lua dispatcher.
}

# === MONITOR DIM ===
listener {
    timeout = 150                                # 2.5min.
    on-timeout = python3 ~/.config/hypr/scripts/idle-brightness.py dim     # save + dim without a manual-change OSD.
    on-resume = python3 ~/.config/hypr/scripts/idle-brightness.py restore  # restore quietly when activity resumes.
}

# === LOCKSCREEN ===
listener {
    timeout = 300                                 # 5min
    on-timeout = pidof hyprlock || hyprlock         # avoid a second lock process if already locked.
}

# === TURN OFF SCREEN ===
listener {
    timeout = 330                                                     # 5.5min
    on-timeout = ~/.config/hypr/scripts/display-power.sh off           # screen off when timeout has passed
    on-resume = ~/.config/hypr/scripts/display-power.sh on && python3 ~/.config/hypr/scripts/idle-brightness.py restore  # screen on and quiet backlight restore.
}

# === SUSPEND ===
listener {
    timeout = 1800                                # 30min
    on-timeout = systemctl suspend                # suspend pc
}

# === SHUTDOWN ===
listener {
    timeout = 3600                    # 60 min
    on-timeout = systemctl poweroff
}

