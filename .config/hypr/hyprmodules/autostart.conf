#################
### AUTOSTART ###
#################

exec-once = awww-daemon
exec-once = ~/.config/quickshell/desktop.sh start
exec-once = hyprctl setcursor Bibata-Modern-Classic 20
exec-once = blueman-applet
exec-once = wlsunset -S 05:00 -s 17:00 -t 3700 -T 6500
exec-once = nm-applet --indicator
exec-once = awww img ~/.config/hypr/current_wallpaper --transition-type center
exec-once = ~/.config/hypr/scripts/restore-colors.sh
exec-once = hypridle
env = ELECTRON_OZONE_PLATFORM_HINT,wayland
