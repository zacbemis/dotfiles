<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- UI text is proportional; terminal/editor text keeps fixed cell widths. -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Ubuntu Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>UbuntuMono Nerd Font Mono</family>
      <family>Ubuntu Mono</family>
    </prefer>
  </alias>
  <!-- Plain Ubuntu Mono requests also receive its Nerd-patched counterpart. -->
  <alias binding="same">
    <family>Ubuntu Mono</family>
    <prefer><family>UbuntuMono Nerd Font Mono</family></prefer>
  </alias>
  <!-- Pango/Qt UI labels can contain Nerd glyphs (Rofi modes, SwayNC buttons).
       Fall back only for missing glyphs, not for ordinary Ubuntu Sans text. -->
  <alias binding="same">
    <family>Ubuntu Sans</family>
    <accept><family>Symbols Nerd Font</family></accept>
  </alias>
</fontconfig>
