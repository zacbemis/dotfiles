id = "herdr-mobile-bridge"
name = "Herdr Mobile Bridge"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "Show running Herdr TUI agents in the official Herdr mobile app"
platforms = ["linux"]

[[build]]
command = ["cargo", "build", "--locked", "--release"]

[[startup]]
command = ["./target/release/herdr-mobile-bridge", "sync"]

[[events]]
on = "pane.agent_detected"
command = ["./target/release/herdr-mobile-bridge", "sync"]

[[events]]
on = "pane.agent_status_changed"
command = ["./target/release/herdr-mobile-bridge", "sync"]

[[actions]]
id = "sync"
title = "Sync TUI agents to Herdr Core"
command = ["./target/release/herdr-mobile-bridge", "sync"]
