[package]
name = "herdr-mobile-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Expose Herdr TUI agents in the official Herdr mobile app"
publish = false

[workspace]

[dependencies]
base64 = "0.22"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strip-ansi-escapes = "0.2.1"
unicode-width = "0.2"
